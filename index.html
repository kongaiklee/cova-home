<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/favicon-mark.png" />
    <link rel="alternate" type="application/rss+xml" title="Covarage Guides" href="/feed.xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- GA4. The measurement ID is PUBLIC by construction - it ships in the HTML of every page
         - so it lives here rather than in a dashboard setting nobody can see from the code
         (Kong, 2026-09-09: "u cant insert a ga4 tag?"). VITE_GA4_ID overrides it if a second
         property is ever wanted for a branch.

         The guard is the HOST, not the value: only covarage.com reports. A preview build, a
         branch deployment and localhost all run this file, and without the guard every render
         a seat does while working would land in the property as real traffic. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      (function () {
        var id = '%VITE_GA4_ID%';
        if (!/^G-[A-Z0-9]+$/.test(id)) id = 'G-GCME9MG1SC';
        var host = location.hostname;
        if (host !== 'covarage.com' && host !== 'www.covarage.com') return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', id, { anonymize_ip: true });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
    <!-- Title and SEO meta are injected per-route by src/components/Seo.tsx -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
